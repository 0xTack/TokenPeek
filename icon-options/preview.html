<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 40px; background: #17191d; color: #f5f5f7;
         font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p  { color: #a1a1a6; margin: 0 0 32px; font-size: 14px; }
  .row { display: flex; gap: 36px; align-items: flex-start; }
  .option { flex: 1; text-align: center; }
  .option img { width: 220px; height: 220px; border-radius: 44px; display: block; margin: 0 auto 16px; }
  .label { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .desc { font-size: 12px; color: #a1a1a6; line-height: 1.5; }
  .tag { display: inline-block; margin-top: 10px; padding: 3px 9px; border-radius: 99px;
         background: #2c2c2e; color: #d1d1d6; font-size: 11px; }
</style>
</head>
<body>
  <h1>选一个 App 图标</h1>
  <p>黑色/浅色/深蓝三种风格。选定后我会把它做成 macOS .icns，装进 App 和程序库。</p>
  <div class="row">
    <div class="option">
      <img src="option1-dark.png" alt="Option A">
      <div class="label">A · 极简黑</div>
      <div class="desc">深色底 + 绿色空心圆<br>和菜单栏图标最一致</div>
      <div class="tag">推荐</div>
    </div>
    <div class="option">
      <img src="option2-light.png" alt="Option B">
      <div class="label">B · 浅色玻璃</div>
      <div class="desc">浅灰底 + 绿色圆环<br>红色小弧线代表高峰</div>
      <div class="tag">清爽</div>
    </div>
    <div class="option">
      <img src="option3-blue.png" alt="Option C">
      <div class="label">C · 深蓝</div>
      <div class="desc">深海蓝底 + 白色圆环<br>绿色弧线代表空闲</div>
      <div class="tag">沉稳</div>
    </div>
  </div>
</body>
</html>
