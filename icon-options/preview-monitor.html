<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 40px; background: #17191d; color: #f5f5f7;
         font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p  { color: #a1a1a6; margin: 0 0 30px; font-size: 14px; line-height: 1.5; }
  .row { display: flex; gap: 34px; align-items: flex-start; }
  .option { flex: 1; text-align: center; }
  .option img { width: 220px; height: 220px; border-radius: 44px; display: block; margin: 0 auto 16px; }
  .label { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .desc { font-size: 12px; color: #a1a1a6; line-height: 1.55; }
  .tag { display: inline-block; margin-top: 10px; padding: 3px 9px; border-radius: 99px;
         background: #2c2c2e; color: #d1d1d6; font-size: 11px; }
  .note { margin-top: 34px; padding: 14px 16px; border-radius: 10px; background: #22252a;
          color: #a1a1a6; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>更明确地表达「API 流量监测」</h1>
  <p>不建议在图标上写 “API” 文字：16–32px 下看不清。用符号表达更稳。</p>
  <div class="row">
    <div class="option">
      <img src="option4-pulse.png" alt="D">
      <div class="label">D · 脉冲环</div>
      <div class="desc">绿色空心环 + 心跳线<br>既表示状态，也像监控探针</div>
      <div class="tag">推荐</div>
    </div>
    <div class="option">
      <img src="option5-network.png" alt="E">
      <div class="label">E · 节点环</div>
      <div class="desc">圆环 + 三个连接节点<br>更像 API / 网络拓扑</div>
      <div class="tag">技术感</div>
    </div>
    <div class="option">
      <img src="option6-bars.png" alt="F">
      <div class="label">F · 用量柱</div>
      <div class="desc">圆环 + 三根柱状图<br>直接表达“用量统计”</div>
      <div class="tag">报表感</div>
    </div>
  </div>
  <div class="note">
    推荐 D：菜单栏只保留空心圆，App 图标用「脉冲环」补足“监测”含义；两者一眼能对应上。<br>
    如果更想强调“接口调用”，选 E；更想强调“用量/账单”，选 F。
  </div>
</body>
</html>
