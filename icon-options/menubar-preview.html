<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 36px 40px 44px; background: #17191d; color: #f5f5f7;
         font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: #a1a1a6; font-size: 13px; margin: 0 0 28px; }
  .card { background: #202328; border-radius: 14px; padding: 20px 22px; margin-bottom: 18px; }
  .card h2 { font-size: 13px; font-weight: 600; color: #d1d1d6; margin: 0 0 14px; }
  .bar { height: 44px; border-radius: 10px; display: flex; align-items: center;
         gap: 18px; padding: 0 16px; font-size: 12px; }
  .bar.light { background: #e9e7e2; color: #1d1d1f; }
  .bar.dark  { background: #2c2c2e; color: #f5f5f7; }
  .spacer { flex: 1; }
  .item { display: inline-flex; align-items: center; gap: 6px; }
  .ring { width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; border: 2px solid; }
  .green  { border-color: #30d158; }
  .orange { border-color: #ff9f0a; }
  .time { font-variant-numeric: tabular-nums; opacity: .8; }
  .big-row { display: flex; gap: 46px; align-items: center; padding: 8px 4px 2px; }
  .big-item { text-align: center; }
  .big-ring { width: 52px; height: 52px; border-radius: 50%; box-sizing: border-box;
              border: 8px solid; margin: 0 auto 12px; }
  .big-label { font-size: 13px; color: #d1d1d6; }
  .big-sub { font-size: 11px; color: #8e8e93; margin-top: 3px; }
  .legend { display: flex; gap: 28px; margin-top: 6px; font-size: 12px; color: #a1a1a6; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.g { background: #30d158; }
  .dot.o { background: #ff9f0a; }
</style>
</head>
<body>
  <h1>菜单栏图标预览</h1>
  <p class="sub">空闲 = 绿色空心圆，高峰 = 橙色空心圆。App 实际尺寸是 13px 圆环、2px 描边。</p>

  <div class="card">
    <h2>实际大小（浅色菜单栏）</h2>
    <div class="bar light">
      <span class="item"><span class="ring green"></span>空闲</span>
      <span class="item"><span class="ring orange"></span>高峰</span>
      <span class="spacer"></span>
      <span class="time">10月31日 周六 11:30</span>
    </div>
  </div>

  <div class="card">
    <h2>实际大小（深色菜单栏）</h2>
    <div class="bar dark">
      <span class="item"><span class="ring green"></span>空闲</span>
      <span class="item"><span class="ring orange"></span>高峰</span>
      <span class="spacer"></span>
      <span class="time">10月31日 周六 11:30</span>
    </div>
  </div>

  <div class="card">
    <h2>放大 4 倍</h2>
    <div class="big-row">
      <div class="big-item">
        <div class="big-ring green"></div>
        <div class="big-label">空闲</div>
        <div class="big-sub">绿色</div>
      </div>
      <div class="big-item">
        <div class="big-ring orange"></div>
        <div class="big-label">高峰 / 忙</div>
        <div class="big-sub">橙色</div>
      </div>
    </div>
    <div class="legend">
      <span><span class="dot g"></span>#30D158 绿色</span>
      <span><span class="dot o"></span>#FF9F0A 橙色</span>
    </div>
  </div>
</body>
</html>
