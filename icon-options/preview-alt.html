<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 40px; background: #17191d; color: #f5f5f7;
         font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p  { color: #a1a1a6; margin: 0 0 30px; font-size: 14px; line-height: 1.5; }
  .row { display: flex; gap: 34px; align-items: flex-start; }
  .option { flex: 1; text-align: center; }
  .option img { width: 220px; height: 220px; border-radius: 44px; display: block; margin: 0 auto 16px; }
  .label { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .desc { font-size: 12px; color: #a1a1a6; line-height: 1.55; }
  .tag { display: inline-block; margin-top: 10px; padding: 3px 9px; border-radius: 99px;
         background: #2c2c2e; color: #d1d1d6; font-size: 11px; }
  .note { margin-top: 34px; padding: 14px 16px; border-radius: 10px; background: #22252a;
          color: #a1a1a6; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>换一组：更像“监测工具”的图标</h1>
  <p>这次不再用抽象圆环，换成仪表、雷达、品牌字母三种方向。</p>
  <div class="row">
    <div class="option">
      <img src="option7-gauge.png" alt="G">
      <div class="label">G · 仪表盘</div>
      <div class="desc">刻度 + 指针 + 绿色进度<br>最直观地表达“用量/额度监测”</div>
      <div class="tag">最像监测工具</div>
    </div>
    <div class="option">
      <img src="option8-radar.png" alt="H">
      <div class="label">H · 雷达</div>
      <div class="desc">同心圆 + 扫描线 + 信号点<br>强调实时流量、探测</div>
      <div class="tag">实时感</div>
    </div>
    <div class="option">
      <img src="option9-monogram.png" alt="I">
      <div class="label">I · D + 脉冲</div>
      <div class="desc">品牌字母 D + 心跳线<br>品牌识别 + 监控含义</div>
      <div class="tag">品牌感</div>
    </div>
  </div>
  <div class="note">
    如果只选一个：G 最不容易被误解成“状态灯”；H 更像网络流量；I 更像 DeepSeek 自家产品。<br>
    也可以混搭：G 的仪表盘 + 小绿点，或 I 的 D + 仪表弧线。
  </div>
</body>
</html>
